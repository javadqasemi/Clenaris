# ===========================================================================
#  Clenaris — Prüfung und Auslieferung
# ===========================================================================
#
# Ein Push auf `main` durchläuft zwei Aufträge:
#
#   qualitaet      Linter, Typen, Dokumentation, Schema und Datenbankschranken,
#                  Build, **dann sofort** das Release-Artefakt aus genau diesem
#                  Bau (mit SHA-256) — und erst danach die vollständige
#                  Testreihe gegen denselben Bau
#   auslieferung   Artefakt auf den Server, `deploy/v2/release-aktivieren.sh`
#                  **aus dem Artefakt selbst**, Identitätsprüfung von aussen —
#                  kein Bau, kein `npm ci`, kein `git pull` dort
#                  (Notfallauftrag 2026-09-27, Phase 8; Vertrag C3 seit 2026-09-30)
#
# Der zweite läuft nur, wenn der erste vollständig grün ist. Es gibt keinen
# Weg, die Prüfung zu überspringen — das ist der Zweck der Trennung.
#
# Dazu ein dritter, nur von Hand ausgelöster Auftrag:
#
#   reproduzierbarkeit   denselben Commit zweimal bauen und die Bäume
#                        vergleichen (`scripts/bau-vergleich.ts`)
#
# Neben `auslieferung` gibt es einen zweiten Weg in die Produktion: den
# Release-Ausführer (`deploy/v2/release-ausfuehrer.yml`), der Termine aus dem
# Release Center abarbeitet. Beide Wege bleiben (Entscheid der Betreiberin,
# 2026-09-30) — und beide folgen **demselben** Vertrag: Aktivierungsskript aus
# dem geprüften Archiv, erwartete Summe als Pflichtargument, Erfolg nur bei
# bestätigter Identität (Commit, Build-ID, `belegt`), und eine gemeinsame
# Nebenläufigkeitsgruppe, damit nie zwei Aktivierungen zugleich laufen.
# `tests/api/release-ausfuehrer-vorlage.test.ts` hält beide Seiten fest.
#
# Warum die Testreihe hier so aufwendig ist: Die Prüfungen dieses Projekts
# fahren die **laufende Anwendung über echtes HTTP** an (siehe `tests/README.md`).
# Unit-Tests der Dienste gibt es bewusst nicht. Also braucht der Auftrag eine
# echte PostgreSQL-Datenbank, ein vollständiges Schema, Demodaten und einen
# gestarteten Produktionsbuild. Ein Workflow, der nur `npm test` aufruft,
# scheitert sofort mit «Kein Server erreichbar» — und wer daraufhin die Tests
# aus der Pipeline nimmt, hat die Pipeline abgeschafft, nicht repariert.
#
# Nirgends in dieser Datei steht ein Ausdruck in doppelten geschweiften
# Klammern innerhalb eines `run:`-Blocks. GitHub setzt solche Ausdrücke
# **vor** der Shell in den Skripttext ein: Enthält der Wert ein `"` oder
# `$(…)`, ist er Code. Werte erreichen die Skripte deshalb nur über `env:`.

name: Auslieferung

# Drei Auslöser, und nur zwei davon dürfen je einen Server berühren.
#
# `pull_request` ist seit Production V2 dabei: Bis dahin prüfte dieser
# Workflow ausschliesslich `main` — also *nach* dem Zusammenführen. Ein
# Fehler fiel damit zum spätestmöglichen Zeitpunkt auf, nämlich auf dem
# Zweig, der ausgeliefert wird.
#
# Bewusst `pull_request` und **nicht** `pull_request_target`: Letzteres führt
# den Workflow im Kontext des Zielzweigs aus und stellt dabei die Secrets des
# Repositories bereit — während der geprüfte Code aus dem Pull Request stammt.
# Wer einen Fork öffnen darf, bekäme damit die Produktions-Secrets. Bei
# `pull_request` läuft der Code des Pull Requests ohne Secrets; genau deshalb
# kommt das Qualitätstor unten mit Wegwerfwerten aus und liest kein einziges
# `secrets.*`.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Ohne Eingaben seit 2026-09-27. Hier standen `seed` (Konfigurations-Seed
  # auf dem Server) und `skip_rollback`. Beides gehörte zu `scripts/deploy.sh`,
  # das auf dem Server baute; die Aktivierung eines Artefakts seedet nicht und
  # springt bei fehlgeschlagener Identitätsprüfung immer zurück. Die
  # Ersteinrichtung eines Servers (erstes Verwaltungskonto) ist ein bewusster
  # Handgriff (`scripts/create-admin.ts`), kein Häkchen in einem Formular.
  workflow_dispatch:

# Zwei Läufe desselben Zweigs gleichzeitig prüften gegeneinander. Für `main`
# deshalb `cancel-in-progress: false`: Ein *abgebrochener* Lauf liesse eine
# Auslieferung in einem halben Zustand zurück — der zweite wartet.
#
# Für einen Pull Request gilt das Gegenteil. Dort berührt niemand einen
# Server, und wer zweimal hintereinander pusht, will die Meinung zum neuen
# Stand, nicht zum alten. Ein laufender Lauf auf einem überholten Stand kostet
# nur Wartezeit.
#
# Der Auftrag `auslieferung` gehört **zusätzlich** zur Gruppe
# `clenaris-auslieferung-production`, die er mit dem Release-Ausführer teilt
# (siehe dort).
concurrency:
  group: auslieferung-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nur lesen, und zwar als Vorgabe für alle Aufträge. Der Workflow schreibt
# nichts ins Repository zurück: keine Marke, kein Kommentar, keine Freigabe
# eines Pull Requests. `contents: read` ist das Einzige, was bleibt, weil
# `actions/checkout` im Qualitätstor es braucht; der Auslieferungsauftrag
# setzt es weiter unten auf gar nichts.
permissions:
  contents: read

jobs:
  # =========================================================================
  #  1) Qualitätstor
  # =========================================================================
  #
  # Die Reihenfolge ist seit 2026-09-30 eine Aussage, keine Gewohnheit:
  #
  #   npm ci → statische Prüfungen → Stückliste
  #     → Migrationen → Datenbankschranken
  #     → Konfigurations-Seed → Build → Leistungsbudget
  #     → Artefakt packen                    (vor jedem Serverstart)
  #     → Demo-Seed → Testserver → Prüfreihen
  #     → Artefakt ablegen                   (nur Push/Dispatch auf main)
  #
  # Drei Regeln stecken darin, und jede verhindert einen bestimmten Fehler:
  #
  #  • **Der Bau sieht nur Konfiguration, keine Demodaten.** Die öffentliche
  #    Website wird beim Bau aus der Datenbank vorgerendert. Lag der Demo-Seed
  #    vorher im Bestand, landeten Demokundschaft und Demotexte im Bündel —
  #    und damit im Artefakt, das in die Produktion geht. `release-artefakt.ts`
  #    verweigert ein solches Artefakt; hier entsteht es gar nicht erst.
  #  • **Gepackt wird vor dem ersten Serverstart.** Der gestartete Prüfserver
  #    schreibt in `.next` (neu gerenderte Seiten, jetzt mit Demodaten), und
  #    ein danach gepacktes Artefakt enthielte, was die Prüfreihe dort
  #    hinterlassen hat. Vorher gepackt ist es genau die Ausgabe des Baus.
  #    Abgelegt wird es trotzdem erst nach grünen Prüfreihen: Ein Artefakt
  #    aus einem roten Lauf gibt es nicht.
  #  • **Kein Build-Zwischenspeicher.** Hier stand bis 2026-09-30
  #    `actions/cache` für `.next/cache`, geschlüsselt über Sperrdatei und
  #    `src/**/*.ts(x)` mit Rückfall auf ältere Stände. Das ausgelieferte
  #    Bündel hing damit auch von einem früheren Lauf ab — Zustand, den kein
  #    Commit beschreibt —, und der Schlüssel übersah Konfiguration, `public/`
  #    und das Schema. Ein Artefakt muss aus dem Commit allein entstehen; die
  #    paar Minuten Bauzeit sind der Preis dafür.
  qualitaet:
    name: Prüfung
    runs-on: ubuntu-latest
    # 45 statt 30 seit 2026-09-27: Das Release-Artefakt (mit `node_modules`)
    # wird in diesem Auftrag gepackt und abgelegt. Die Läufe davor dauerten
    # 22–26 Minuten; mit Packen und Hochladen wäre 30 knapp, und ein Abbruch
    # an der Zeitgrenze sähe aus wie ein roter Test.
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clenaris
          POSTGRES_PASSWORD: clenaris
          POSTGRES_DB: clenaris_test
        ports:
          - 5432:5432
        # Ohne diese Prüfung starten die ersten Schritte, während Postgres noch
        # hochfährt — das Ergebnis ist ein sporadisch roter Lauf ohne Ursache
        # im Code, und genau die zerstören das Vertrauen in eine Pipeline.
        options: >-
          --health-cmd "pg_isready -U clenaris -d clenaris_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://clenaris:clenaris@localhost:5432/clenaris_test
      # Das Schema deklariert `directUrl`. Ohne gesetzten Wert bricht jeder
      # Prisma-Aufruf ab — in CI gibt es keinen Pooler, also zeigt beides
      # auf dieselbe Datenbank.
      DIRECT_URL: postgresql://clenaris:clenaris@localhost:5432/clenaris_test
      # Wegwerfwert, nur für diesen Lauf. Mindestens 32 Zeichen, sonst weist
      # die Konfigurationsprüfung in `src/lib/env.ts` ihn zurück.
      JWT_SECRET: ci-nur-fuer-den-testlauf-mindestens-32-zeichen
      # Muss im Server *und* im Testprozess gleich sein: `flows.test.ts` ruft
      # `/api/cron/daily` mit genau diesem Wert auf.
      CRON_SECRET: ci-cron-secret
      # V2-1 (2026-09-26): Die Herkunft der Instanz kommt zur Laufzeit aus
      # `APP_URL` — hier der Testserver. Beim Bau fest steht nur die
      # kanonische Domain der statischen Website (`src/lib/seiten-url.ts`),
      # und die ist für jede Umgebung dieselbe: die Produktionsdomain. Damit
      # ist der Bau dieses Laufs derselbe, der ausgeliefert werden könnte.
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: https://clenaris.qasemi.ch
      # Bewusst `development` für den Auftrag, nicht `production`: Der Seed
      # verweigert in der Produktion den Dienst, solange kein eigenes
      # Startpasswort gesetzt ist (siehe `prisma/seed.ts`) — richtig auf einem
      # echten System, hinderlich für eine Wegwerf-Datenbank. Der Build (Stufe
      # „Build", eigene `env`) und der gestartete Server
      # (`scripts/test-server.ts`) setzen `production` ausdrücklich.
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'

    # Fremde Aktionen sind auf einen **Commit** festgelegt, nicht auf ein Tag
    # (2026-09-26). Ein Tag wie `v4` ist ein verschiebbarer Zeiger: Wer das
    # Repository der Aktion übernimmt, hängt ihn um, und der nächste Lauf führt
    # fremden Code mit dem Token dieses Laufs aus — so geschehen bei
    # `tj-actions/changed-files` (März 2025). Ein Commit-Hash lässt sich nicht
    # umhängen.
    #
    # Jeder Hash unten wurde über die GitHub-API aufgelöst — `v4` und das
    # genaue Versions-Tag im Kommentar zeigen auf denselben Commit —, also
    # läuft derselbe Code wie vorher. Aktualisieren heisst: neues Tag
    # auflösen, Hash **und** Kommentar ersetzen, nie nur eins von beiden
    # (docs/GITHUB_GOVERNANCE.md, „Aktionen festlegen").
    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Kein Token in `.git/config` zurücklassen: Kein späterer Schritt
          # schreibt ins Repository, und ein Token auf der Platte des Läufers
          # wäre für jedes Skript der Prüfreihe lesbar — auch für eine
          # kompromittierte Abhängigkeit, die `npm ci` gerade installiert hat.
          persist-credentials: false

      - name: Node einrichten
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          # Zwischenspeicher für `~/.npm`, geschlüsselt über package-lock.json.
          # Anders als der frühere `.next/cache` ändert er nichts am Ergebnis:
          # `npm ci` prüft jedes Paket gegen die Prüfsumme der Sperrdatei.
          cache: npm

      - name: Abhängigkeiten installieren
        # `npm ci` statt `npm install`: nur die Sperrdatei zählt, der Baum wird
        # vorher gelöscht. Ein Lauf, der eine andere Fassung zieht als die
        # Auslieferung, prüft nicht das, was ausgeliefert wird.
        run: npm ci --no-audit --no-fund

      # -- Statische Prüfungen zuerst: Sie brauchen keine Datenbank und
      #    scheitern in Sekunden statt in Minuten. -------------------------
      - name: Statische Prüfungen (verify:static)
        # **Derselbe Befehl wie örtlich** (2026-09-27, Definition of Done
        # Phase 47). Hier standen bis dahin die Einzelschritte von Hand —
        # Hydrationskorrektur, kritische Lücken, Linter, Typen, Prisma-Schema,
        # Geheimnisse, statische Sicherheitsprüfung, Dokumentation aktuell,
        # Merkmalsprüfung. Eine zweite Aufzählung neben der örtlichen läuft
        # auseinander: Ein Schritt kommt hier dazu und fehlt dort. Die Folge
        # und die Begründung jedes Schritts stehen jetzt in `scripts/verify.ts`;
        # jeder Schritt meldet sich dort unter seinem Namen, und das Protokoll
        # dieser Stufe zeigt am Ende, welcher gescheitert ist.
        #
        # Die Merkmalsprüfung schreibt ihr Ergebnis weiter in die
        # Zusammenfassung des Laufs. Ihre Heuristiken blockieren nicht; ihr
        # struktureller Teil (security/struktur-grundlinie.json) seit
        # 2026-09-29 schon.
        run: npm run verify:static

      - name: Stückliste (CycloneDX)
        run: npm run security:sbom

      - name: Sicherheitsbericht und Stückliste sichern
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sicherheitsbericht
          path: security-reports/
          if-no-files-found: ignore
          retention-days: 90

      # Die Merkmalsprüfung läuft in `verify:static` mit. Sie sucht das Muster
      # „Schema + Berechtigung + Oberfläche, aber kein Schreibpfad" und
      # **blockiert nicht, mit Absicht**: Sie arbeitet über den Quelltext und
      # meldet erwiesenermassen auch Fälle, die in Ordnung sind. Eine
      # Heuristik, die den Bau anhält, wird binnen einer Woche mit
      # Ausnahmelisten stillgelegt. Wer sie als Tor will, ruft
      # `scripts/feature-integrity.ts --streng`. Blockierend ist nur der
      # Vergleich mit der strukturellen Grundlinie: verschwundene Endpunkte,
      # Berechtigungen, Migrationen, Navigationsziele ohne Seite — Tatsachen,
      # keine Heuristik (`scripts/strukturgrundlinie.ts`).
      - name: Merkmalsbericht sichern
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: feature-integrity-report
          path: artifacts/feature-integrity-report.json
          if-no-files-found: ignore
          retention-days: 14

      # -- Ab hier mit Datenbank ----------------------------------------
      - name: Datenbankschema anwenden
        run: npx prisma migrate deploy

      - name: Datenbankschranken prüfen
        # Unmittelbar nach der Migration und vor jedem Schreiben: Trigger,
        # Prüfregeln und Teilindizes, auf die sich Finanzbelege, Protokoll
        # und Verträge verlassen, müssen im frisch migrierten Schema stehen.
        # Fehlt eine, prüfte die ganze Testreihe danach ein Schema, das die
        # Produktion nicht hat — und bestünde womöglich gerade deshalb.
        #
        # Liest `DATABASE_URL` aus der Umgebung dieses Auftrags. Jeder Ausgang
        # ausser 0 hält den Lauf an, auch 2 („nicht geprüft", etwa ohne
        # Verbindung): Eine Prüfung, die nicht lief, ist kein Bestehen.
        run: npx tsx scripts/datenbank-schranken.ts

      - name: Konfiguration einspielen
        # **Nur** die Konfiguration (Firma, Leistungen, Preise, Gebiet, Team),
        # keine Demodaten — der Bau im nächsten Schritt rendert die Website aus
        # genau diesem Bestand vor (siehe Kopf des Auftrags). Die Demodaten
        # folgen erst nach dem Packen, für die Prüfreihen.
        run: npm run db:seed

      - name: Build
        # Ein einziger Build für Oberfläche und Schnittstelle: Die Anwendung ist
        # eine Next-Anwendung mit App Router, Server Components und Route
        # Handlers im selben Baum. Ein getrennter «Backend-Build» existiert
        # nicht und liesse sich nur künstlich herstellen.
        #
        # `NODE_ENV: production` ausdrücklich für diese Stufe. Der Auftrag
        # setzt `development` (wegen des Seeds, siehe oben), und `next build`
        # übernimmt einen gesetzten Wert, statt ihn zu ersetzen: Mit
        # `development` bricht der Bau beim Vorrendern von `/404` ab
        # („<Html> should not be imported outside of pages/_document"). So
        # geschehen im ersten Lauf dieses Zweigs (PR #3, Lauf 36270931878) und
        # örtlich genau so nachgestellt. Die frühere Annahme hier, der Bau setze
        # `production` selbst, war falsch.
        #
        # Ohne `.next/cache` aus einem früheren Lauf — siehe Kopf des Auftrags.
        env:
          NODE_ENV: production
        run: npm run build

      # Seit 2026-09-28 — derselbe Schritt wie in `verify:full`: JavaScript je
      # Route gegen `scripts/leistungsbudget.json`. Grössen sind auf jedem
      # Läufer gleich; ein Paket, das versehentlich in den gemeinsamen Rahmen
      # rutscht, hält den Lauf hier an und nicht erst im Feld.
      - name: Leistungsbudget
        run: npx tsx scripts/leistungsbudget.ts

      # -- Release-Artefakt ---------------------------------------------
      #
      # Notfallauftrag 2026-09-27, Phase 8: Die letzte Auslieferung auf den
      # alten Server holte den Quelltext, installierte, migrierte und baute
      # **dort** — mit 4,6 GB Heap, auf einer Maschine, die als nicht
      # vertrauenswürdig galt. Ausgeliefert wurde damit ein Bau, den keine
      # Prüfung je gesehen hatte, erzeugt von einem Rechner, dem niemand
      # traute.
      #
      # Ab hier entsteht das, was ausgeliefert wird, **hier**: aus genau dem
      # Bau, gegen den die Prüfreihen gleich laufen, als Archiv mit Manifest
      # (`RELEASE.json`, Format 2), Beilage und SHA-256
      # (`scripts/release-artefakt.ts`). Der Server prüft die Summe und
      # schaltet um; er baut nichts.
      #
      # Gepackt wird in **jedem** Lauf, auch im Pull Request: Dort sagt das
      # Manifest `auslieferbar: false` (kein Push auf main), das Archiv ist eine
      # Probe — und das Packen selbst ist damit in jedem Pull Request geprüft,
      # nicht erst beim ersten Push nach dem Zusammenführen.
      - name: Release-Artefakt packen
        run: npx tsx scripts/release-artefakt.ts --ausgabe release

      - name: Prüfsumme in die Zusammenfassung
        run: |
          {
            echo "## Release-Artefakt"
            echo ""
            echo '```'
            cat release/*.sha256
            node -e '
              const fs = require("node:fs");
              for (const name of fs.readdirSync("release").filter((n) => n.endsWith(".json"))) {
                const b = JSON.parse(fs.readFileSync("release/" + name, "utf8"));
                console.log(name + ": commit=" + b.commit + " buildId=" + b.buildId + " auslieferbar=" + b.auslieferbar);
              }
            '
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Demodaten einspielen
        # Erst jetzt: Die Prüfungen erwarten die fünf Demokonten und einen
        # Datenbestand, das Artefakt darf sie nie gesehen haben (siehe oben).
        # `db:seed:demo` ist idempotent und enthält den Konfigurations-Seed.
        run: npm run db:seed:demo

      # -- Browser ------------------------------------------------------
      #
      # Gate 4D.1 hat die Browserebene als release-relevant eingeführt, und
      # Gate 4D.2 hat gezeigt, warum sie es ist: Der PDF-Viewer war in jedem
      # echten Chrome kaputt, während 812 HTTP-Prüfungen grün blieben. Ein
      # Lauf, der diese Ebene auslässt, prüft das Produkt nicht dort, wo die
      # Kundschaft es benutzt. Installiert wird vor den Prüfreihen, die sie
      # als letzten Schritt fahren.
      #
      # Seit 2026-09-28 alle drei Engines: `*.browser.spec.ts` läuft auch in
      # Firefox und WebKit (`playwright.config.ts`). Anlass war ein
      # Bildfehler, der in Chromium nicht auftrat — eine Reihe mit einer
      # Engine hätte ihn nie gesehen.
      - name: Browser installieren
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Anwendung starten
        # **Über `scripts/test-server.ts`, nicht über ein nacktes
        # `next start`.** Das Skript legt die Umgebung der Prüfreihe an einer
        # Stelle fest: Testdatenbank (mit Namensschutz), `NODE_ENV=production`,
        # `TRUSTED_PROXY_MODE=NONE`, Rate-Limit-Zähler als Dateien, die festen
        # Prüfgeheimnisse für den Resend-Webhook und den Berichtseingang
        # (`tests/helpers/webhooks.ts`) und das Prüfmanifest der Identität.
        # Bis 2026-09-26 stand hier eine Nachbildung von Hand, die nur einen
        # Teil davon setzte — der erste CI-Lauf dieses Zweigs (Lauf
        # 36271930469) scheiterte deshalb in zwölf Fällen, die örtlich grün
        # waren (Zustellmeldungen, Berichtseingang). Zwei Kopien derselben
        # Umgebung laufen auseinander; eine nicht.
        env:
          PORT: '3000'
          CLENARIS_TEST_CACHE_DIR: ${{ runner.temp }}/clenaris-tests/cache
        run: |
          # Das Verzeichnis muss vor dem Start stehen: Dort landen die
          # Rate-Limit-Zähler und der simulierte Postausgang. Die
          # Browser-Prüfreihe verweigert den Start, wenn es fehlt — der
          # Offertlink aus Gate 4C ist nur dort zu holen.
          mkdir -p "${CLENARIS_TEST_CACHE_DIR}"
          npx tsx scripts/test-server.ts > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 60); do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' http://localhost:3000/api/health || echo 000)
            if [ "$code" = "200" ]; then
              echo "Anwendung antwortet nach ${i}s."
              curl -fsS http://localhost:3000/api/health
              exit 0
            fi
            sleep 1
          done
          echo "::error::Die Anwendung ist nicht hochgekommen."
          cat server.log
          exit 1

      - name: Prüfreihen (verify:tests)
        # **Derselbe Befehl wie örtlich** (2026-09-27): Sicherheitsreihen
        # (`security:check:tests`, zuerst und als eigener Schritt, damit ein
        # Sicherheitsbefund als solcher sichtbar ist), vollständige Testreihe
        # (seriell — alle Dateien teilen eine Datenbank und fünf Demokonten)
        # und Browser-Prüfreihe **ohne Wiederholungen** gegen den bereits
        # laufenden Server auf 3000; der Port kommt aus `TEST_BASE_URL`, der
        # Postausgang aus demselben `CLENARIS_TEST_CACHE_DIR` wie der Server.
        run: npm run verify:tests
        env:
          TEST_BASE_URL: http://localhost:3000
          CLENARIS_TEST_CACHE_DIR: ${{ runner.temp }}/clenaris-tests/cache

      - name: Browser-Bericht sichern
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-bericht
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Anwendung beenden
        if: always()
        run: '[ -f server.pid ] && kill "$(cat server.pid)" || true'

      - name: Release-Artefakt ablegen
        # Nur, was ausgeliefert werden darf: ein Push oder ein von Hand
        # ausgelöster Lauf **auf main** — dieselbe Regel wie `auslieferbarNach`
        # im Manifest. Ein Pull-Request-Lauf packt (siehe oben), legt aber
        # nichts ab; eine Probe in der Ablage wäre ein Artefakt, das jemand
        # für auslieferbar halten könnte. Ohne `always()`: nach einer roten
        # Prüfreihe wird dieser Schritt übersprungen.
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ github.sha }}
          path: release/
          retention-days: 30
          if-no-files-found: error

      - name: Server-Protokoll sichern
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-log
          path: server.log
          retention-days: 7

  # =========================================================================
  #  2) Auslieferung
  # =========================================================================
  auslieferung:
    name: Auslieferung
    needs: qualitaet
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Drei Bedingungen, und alle müssen gelten. `needs: qualitaet` ist die
    # vierte: Der Auftrag beginnt ohnehin nur, wenn das Qualitätstor grün ist.
    #
    # **Erstens: niemals aus einem Pull Request.** Ein Pull Request ist eine
    # Frage, keine Entscheidung. Er darf den vollen Prüflauf auslösen und
    # nichts sonst. Ohne diese Zeile genügte das Öffnen eines Pull Requests,
    # um einen Produktionsserver zu berühren.
    #
    # **Zweitens: nur von `main`.** Ein von Hand ausgelöster Lauf auf einem
    # anderen Zweig ist kein Pull Request und käme an der ersten Bedingung
    # vorbei. Sein Artefakt ist ohnehin nicht auslieferbar (das Manifest
    # verlangt `refs/heads/main`), und es wird gar nicht erst abgelegt — die
    # Bedingung hier sorgt dafür, dass der Auftrag nicht erst am fehlenden
    # Artefakt scheitert, sondern gar nicht beginnt.
    #
    # **Drittens: nur bei ausdrücklich eingeschalteter Auslieferung.**
    # `DEPLOY_ENABLED` ist eine Repository-Variable, und sie ist fail-closed:
    # Ist sie nicht gesetzt, liefert GitHub den leeren String, der Vergleich
    # scheitert, der Auftrag wird übersprungen.
    #
    # Der Grund ist der Zustand des Projekts, nicht Vorsicht im Allgemeinen.
    # Für Production V2 wird ein neuer Server aufgebaut; der bisherige ist
    # Beweismaterial eines Vorfalls und darf nicht mehr beliefert werden. Die
    # Secrets `SERVER_HOST`, `SERVER_SSH_KEY` und `SERVER_SSH_KNOWN_HOSTS`
    # zeigen aber bis zu ihrer Ersetzung weiter auf ihn. Ohne diesen Schalter
    # wäre der erste grüne Lauf nach fünf roten zugleich eine Auslieferung
    # genau dorthin — und zwar ohne dass jemand sie ausgelöst hätte.
    #
    # Eine Variable und kein auskommentierter Auftrag: Auskommentierter Code
    # wird beim Wiedereinschalten nicht gelesen, sondern nur entkommentiert.
    # Eine Variable ist an einer Stelle sichtbar, hat einen Namen und lässt
    # sich zurücknehmen, ohne die Datei anzufassen.
    #
    # Einschalten, sobald der V2-Server steht und die Secrets auf ihn zeigen:
    # Settings → Secrets and variables → Actions → Variables →
    # `DEPLOY_ENABLED` = `true`.
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && vars.DEPLOY_ENABLED == 'true'

    # Dieselbe Gruppe wie der Release-Ausführer (`deploy/v2/release-ausfuehrer.yml`):
    # Gruppen gelten über Workflows hinweg, also wartet eine Auslieferung, bis
    # ein laufender Ausführer fertig ist, und umgekehrt. Zwei Aktivierungen
    # zugleich schalteten abwechselnd um; die Sperre auf dem Server
    # (`.release.lock`, Ausgang 11) fängt das ab, aber erst, nachdem das
    # Archiv übertragen ist.
    #
    # Eine Eigenheit von GitHub, die man kennen muss: Je Gruppe wartet höchstens
    # **ein** Lauf. Kommt ein weiterer, wird der wartende abgebrochen. Sind
    # beide Wege gleichzeitig eingeschaltet, kann ein geplanter Ausführerlauf
    # also eine wartende Auslieferung verdrängen. Sie erscheint dann als
    # „cancelled", und auf dem Server ist nichts geschehen — sichtbar, nicht
    # still. Beide Wege zugleich eingeschaltet zu betreiben ist nicht der
    # vorgesehene Zustand.
    concurrency:
      group: clenaris-auslieferung-production
      cancel-in-progress: false

    # Dieser Auftrag checkt nichts aus und liest nichts aus dem Repository —
    # er lädt das Artefakt dieses Laufs, verbindet sich über SSH und ruft dort
    # ein Skript auf. Er braucht deshalb kein einziges Recht am `GITHUB_TOKEN`
    # (das Artefakt desselben Laufs kommt über das Laufzeit-Token der Aktion).
    permissions: {}
    # Bindet den Auftrag an die GitHub-Umgebung «production». Dort liegen die
    # Secrets, und dort lässt sich bei Bedarf eine Freigabe durch eine zweite
    # Person einschalten, ohne den Workflow zu ändern.
    #
    # **Ohne `url:`** — und das ist keine Auslassung, sondern der Grund, warum
    # dieser Workflow vom 14. bis zum 19. September 2026 kein einziges Mal
    # gelaufen ist.
    #
    # Hier stand `url:` mit einem Ausdruck über `secrets.API_URL`. Der
    # `secrets`-Kontext ist in `jobs.<id>.environment.url` nicht verfügbar;
    # erlaubt sind dort nur `github`, `needs`, `strategy`, `matrix`, `job`,
    # `runner`, `env`, `vars`, `steps` und `inputs`. Eine unzulässige
    # Kontextreferenz verwirft GitHub beim Parsen — der Lauf scheitert in
    # derselben Sekunde, in der er entsteht, mit null Jobs, ohne Protokoll und
    # ohne Annotation. Von aussen sah das aus wie ein fehlgeschlagener Test;
    # tatsächlich hat der Workflow nie begonnen.
    #
    # `url:` liefert nur den anklickbaren Verweis in der Oberfläche. Dafür
    # eine Repository-Variable einzuführen, wäre mehr Konfiguration als der
    # Nutzen wert; die Auslieferungsadresse steht ohnehin in der
    # Zusammenfassung am Ende des Laufs. In den Schritten unten bleibt
    # `secrets.API_URL` als Rückfall — dort ist der Kontext zulässig.
    environment:
      name: production

    steps:
      - name: SSH vorbereiten
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.SERVER_HOST }}
          PORT: ${{ secrets.SERVER_PORT }}
          USER_NAME: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"  || { echo "::error::Secret SERVER_SSH_KEY fehlt."; exit 1; }
          test -n "$HOST"     || { echo "::error::Secret SERVER_HOST fehlt."; exit 1; }

          # `SERVER_USER` gehört hierher, obwohl er erst zwei Schritte später
          # gebraucht wird.
          #
          # Fehlt er, ist er nicht etwa „leer" — GitHub setzt die Variable auf
          # den leeren String, `set -u` schlägt also nicht an, und die
          # Verbindung geht als `@host` hinaus. Was dann zurückkommt, ist eine
          # Meldung über die Gegenstelle: Der Server lehnt einen leeren
          # Benutzernamen ab, und im Protokoll steht etwas über
          # Authentifizierung. Man sucht dann am Server, am Schlüssel, an der
          # Firewall — an allem ausser der einen fehlenden Zeile in den
          # Einstellungen.
          #
          # Ebenso wenig wird hier auf `root` zurückgefallen. Ein stiller
          # Rückfall auf den mächtigsten Benutzer ist die falsche Antwort auf
          # eine fehlende Angabe.
          test -n "${USER_NAME:-}" || {
            echo "::error::Secret SERVER_USER fehlt. Ohne Dienstbenutzer wird nicht ausgeliefert — es gibt keine Vorgabe und insbesondere keinen Rückfall auf root."
            exit 1
          }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Der Wirtsschlüssel gehört gepinnt — und zwar zwingend.
          #
          # Hier stand ein Rückfall auf `ssh-keyscan`: Fehlte das Secret, nahm
          # der Lauf den Schlüssel entgegen, den der Gegenüber gerade
          # anbietet, und vertraute ihm. Das ist Vertrauen beim ersten
          # Kontakt — sinnvoll an einem Arbeitsplatz, der sich den Schlüssel
          # merkt, sinnlos in einer Pipeline: Der Läufer fängt jedes Mal bei
          # null an, also ist *jede* Verbindung die erste, und die Prüfung
          # findet nie statt. Wer sich zwischen Läufer und Server stellt,
          # bekommt den privaten Auslieferungsschlüssel — und damit den
          # Server.
          #
          # Deshalb: kein Rückfall. Fehlt das Secret, bricht die Auslieferung
          # ab. Eine Warnung hätte denselben Text und dieselbe Wirkung wie
          # vorher, nämlich keine.
          test -n "${KNOWN_HOSTS:-}" || {
            echo "::error::Secret SERVER_SSH_KNOWN_HOSTS fehlt. Ohne gepinnten Wirtsschlüssel wird nicht ausgeliefert. Den Wert NICHT aus 'ssh-keyscan' übernehmen — das sagt nur, was der Gegenüber gerade anbietet. Den Schlüssel über die Konsole des Anbieters lesen; die fertige Zeile steht in docs/DEPLOYMENT.md 13.4a."
            exit 1
          }
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # Enthält die Datei überhaupt einen Schlüssel für diesen Wirt? Ein
          # Secret mit dem Inhalt «x» wäre sonst genauso «gesetzt» wie ein
          # echter Eintrag, und der Abbruch käme erst beim Verbinden — mit
          # einer Meldung, die auf das Netz zeigt statt auf die Konfiguration.
          #
          # Bei einem abweichenden Port trägt der Eintrag die Form
          # `[host]:port`; `ssh-keygen -F` erwartet ihn genauso.
          if [ "${PORT:-22}" = "22" ]; then suchname="$HOST"; else suchname="[$HOST]:${PORT}"; fi
          ssh-keygen -F "$suchname" -f ~/.ssh/known_hosts >/dev/null 2>&1 || {
            echo "::error::SERVER_SSH_KNOWN_HOSTS enthält keinen Eintrag für ${suchname}. Bei einem Port ungleich 22 muss der Eintrag die Form [host]:port haben."
            exit 1
          }
          echo "Wirtsschlüssel für ${suchname} aus dem Secret übernommen und vorhanden."

      # -- Anwendungsgeheimnisse reisen nicht mehr durch die Pipeline ---------
      #
      # Bis 2026-09-27 stand hier „Secrets auf den Server übertragen":
      # `DATABASE_URL`, `DIRECT_URL`, `JWT_SECRET`, `CRON_SECRET`,
      # `ENCRYPTION_KEY` lagen als GitHub-Secrets vor und wurden bei jeder
      # Auslieferung in die `.env` des Servers gemischt. Der Notfallauftrag
      # hat gezeigt, was das heisst: Jeder Ort, der ein Geheimnis kennt, ist
      # ein Ort, an dem es rotiert werden muss, wenn etwas passiert — und die
      # Pipeline kannte alle.
      #
      # Für Production V2 liegen die Anwendungsgeheimnisse ausschliesslich in
      # `shared/.env` auf dem Server, dort einmal von der Betreiberin angelegt
      # (docs/NOTFALL_WIEDERHERSTELLUNG.md, V2-Aufbau). Dieser Auftrag kennt
      # nur noch, was er zum Verbinden braucht. Was vorher hier geprüft wurde
      # — `DIRECT_URL` vorhanden, `TRUSTED_PROXY_MODE` bekannt,
      # `ENCRYPTION_KEY` im richtigen Format —, prüft jetzt
      # `scripts/production-preflight.ts` auf dem Server, **gegen die Werte,
      # die die Anwendung tatsächlich lesen wird**, statt gegen eine Kopie.

      - name: Release-Artefakt holen
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ github.sha }}
          path: release

      - name: Beilage prüfen
        # Bevor irgendetwas den Läufer verlässt: Ist das Archiv das dieses
        # Laufs? Die Beilage (`clenaris-<sha12>.json`, Vertrag C1) muss genau
        # diesen Commit und genau diesen Lauf nennen, aus `main` stammen,
        # `auslieferbar` sein, und ihre `archivSha256` muss die hier gemessene
        # Summe sein — ebenso die `.sha256` daneben. Die gemessene Summe geht
        # danach als `--erwartet-sha256` an den Server: Dort wird sie gegen
        # das übertragene Archiv geprüft, und nur die Prüfung am Ziel sagt
        # etwas über das Ziel.
        id: beilage
        env:
          ERWARTET_COMMIT: ${{ github.sha }}
          ERWARTET_LAUF: ${{ github.run_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archive=(release/clenaris-*.tar.gz)
          if [ "${#archive[@]}" -ne 1 ]; then
            echo "::error::Genau ein Archiv erwartet, gefunden: ${#archive[@]}."
            exit 1
          fi
          archiv="${archive[0]}"
          test -f "${archiv}.sha256" || { echo "::error::${archiv}.sha256 fehlt."; exit 1; }
          ( cd release && sha256sum -c --status "$(basename "${archiv}").sha256" ) \
            || { echo "::error::Das Archiv passt nicht zu seiner .sha256-Datei."; exit 1; }
          GEMESSEN="$(sha256sum "${archiv}" | cut -d' ' -f1)"
          ARCHIV="${archiv}"
          export ARCHIV GEMESSEN
          node - <<'JS'
          const fs = require('node:fs');
          const abbruch = (text) => {
            console.log('::error::' + text);
            process.exit(1);
          };
          const { ARCHIV: archiv, GEMESSEN: gemessen, ERWARTET_COMMIT: commit, ERWARTET_LAUF: lauf } = process.env;
          if (!/^[0-9a-f]{40}$/.test(commit || '')) abbruch('github.sha ist keine Commit-Kennung.');
          if (!/^[0-9a-f]{64}$/.test(gemessen || '')) abbruch('Die gemessene Summe ist keine SHA-256.');
          const name = 'clenaris-' + commit.slice(0, 12);
          if (archiv !== 'release/' + name + '.tar.gz') abbruch('Das Archiv heisst ' + archiv + ', erwartet ist release/' + name + '.tar.gz.');
          let b;
          try {
            b = JSON.parse(fs.readFileSync('release/' + name + '.json', 'utf8'));
          } catch {
            abbruch('Beilage release/' + name + '.json fehlt oder ist kein JSON.');
          }
          const ci = b.ci && typeof b.ci === 'object' ? b.ci : null;
          const regeln = [
            [b.format === 2, 'format ist nicht 2'],
            [b.anwendung === 'clenaris', 'anwendung ist nicht clenaris'],
            [b.commit === commit, 'commit ist nicht github.sha'],
            [ci !== null, 'ci fehlt (örtlich gepackt)'],
            [ci !== null && ci.lauf === lauf, 'ci.lauf ist nicht dieser Lauf'],
            [ci !== null && ci.ref === 'refs/heads/main', 'ci.ref ist nicht refs/heads/main'],
            [b.auslieferbar === true, 'auslieferbar ist nicht true'],
            [b.archivSha256 === gemessen, 'archivSha256 ist nicht die gemessene Summe'],
            [typeof b.buildId === 'string' && /^[A-Za-z0-9._-]{1,200}$/.test(b.buildId), 'buildId fehlt oder hat unerwartete Zeichen'],
          ];
          const verletzt = regeln.filter(([gilt]) => !gilt).map(([, text]) => text);
          if (verletzt.length > 0) abbruch('Beilage abgewiesen: ' + verletzt.join('; ') + '.');
          const ausgabe = (schluessel, wert) => {
            if (/[\r\n]/.test(wert)) abbruch('Ausgabe ' + schluessel + ' enthält einen Zeilenumbruch.');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, schluessel + '=' + wert + '\n');
          };
          ausgabe('archiv', archiv);
          ausgabe('sha256', gemessen);
          ausgabe('buildid', b.buildId);
          console.log('Beilage in Ordnung: ' + name + ', Build ' + b.buildId + ', Version ' + b.version + '.');
          JS

      - name: Artefakt übertragen und aktivieren
        id: aktivieren
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          PORT: ${{ secrets.SERVER_PORT }}
          USER_NAME: ${{ secrets.SERVER_USER }}
          APP_DIRECTORY: ${{ secrets.APP_DIRECTORY }}
          ARCHIV: ${{ steps.beilage.outputs.archiv }}
          SUMME: ${{ steps.beilage.outputs.sha256 }}
        run: |
          set -euo pipefail
          test -n "${APP_DIRECTORY:-}" || { echo "::error::Secret APP_DIRECTORY fehlt."; exit 1; }
          # Ein absoluter Pfad aus schlichten Zeichen: Er wird Teil eines
          # Befehls auf dem Server und eines scp-Ziels. Die Maskierung unten
          # (`printf %q`) schützt den Befehl; das scp-Ziel liest je nach
          # OpenSSH-Fassung eine entfernte Shell mit, und dort hilft nur, dass
          # nichts zu maskieren ist.
          [[ "${APP_DIRECTORY}" =~ ^/[A-Za-z0-9._/-]+$ ]] \
            || { echo "::error::APP_DIRECTORY muss ein absoluter Pfad aus Buchstaben, Ziffern, . _ / - sein."; exit 1; }
          [[ "${SUMME}" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Keine geprüfte Summe aus der Beilage."; exit 1; }
          port="${PORT:-22}"
          eingang="${APP_DIRECTORY%/}/releases-eingang"

          # Das Aktivierungsskript kommt aus dem geprüften Artefakt selbst,
          # nicht aus einem Arbeitsbaum oder aus `current/` auf dem Server:
          # Ein Skript vom Server wäre genau der ungeprüfte Code, den das
          # Artefakt abschaffen soll — und bei der Erstinstallation gibt es
          # dort noch keines.
          mkdir -p aktivierung
          tar -xzOf "${ARCHIV}" deploy/v2/release-aktivieren.sh > aktivierung/release-aktivieren.sh
          test -s aktivierung/release-aktivieren.sh || { echo "::error::Das Archiv enthält deploy/v2/release-aktivieren.sh nicht."; exit 1; }

          # `StrictHostKeyChecking=yes` ausdrücklich an jeder Verbindung: Die
          # Vorgabe ist `ask`, und was `ask` unter `BatchMode` tut, hängt an
          # der OpenSSH-Fassung des Läufers. Der Eingang entsteht vor der
          # Übertragung — auf einem frischen Server gibt es ihn noch nicht.
          ssh -i ~/.ssh/id_deploy -p "${port}" -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes \
              "${USER_NAME}@${HOST}" "$(printf 'mkdir -p -- %q' "${eingang}")"
          scp -i ~/.ssh/id_deploy -P "${port}" -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes \
              "${ARCHIV}" "${ARCHIV}.sha256" aktivierung/release-aktivieren.sh \
              "${USER_NAME}@${HOST}:${eingang}/"

          # Der Ausgang des Skripts ist der Vertrag (C3), nicht nur „0 oder
          # nicht 0": Er wird festgehalten und einzeln gedeutet, statt dass der
          # erste Fehler den Schritt blind beendet.
          befehl="$(printf 'CLENARIS_BASIS=%q bash %q %q --erwartet-sha256 %q' \
            "${APP_DIRECTORY}" "${eingang}/release-aktivieren.sh" "${eingang}/$(basename "${ARCHIV}")" "${SUMME}")"
          set +e
          ssh -i ~/.ssh/id_deploy -p "${port}" -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 \
              -o StrictHostKeyChecking=yes "${USER_NAME}@${HOST}" "${befehl}"
          code=$?
          set -e
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          case "${code}" in
            0)  echo "Aktiviert, Identität auf dem Server bestätigt." ;;
            20) echo "::error::Die neue Fassung hat ihre Identität nicht bestätigt; der Server ist nachweislich auf die vorherige zurückgesprungen (20 ZURUECK). Nichts ausgeliefert."; exit 1 ;;
            11) echo "::error::Eine andere Aktivierung oder ein Rücksprung lief gerade (11 GESPERRT). Nichts geändert — erneut auslösen, wenn sie fertig ist."; exit 1 ;;
            10) echo "::error::Aktivierung vor dem Umschalten abgebrochen (10 NICHT_UMGESCHALTET). Der Grund steht im Protokoll oben."; exit 1 ;;
            30) echo "::error::Zustand auf dem Server unklar (30 UNKLAR) — sofort von Hand prüfen: current, pm2 ls, /api/health."; exit 1 ;;
            *)  echo "::error::Unerwarteter Ausgang ${code} (255 heisst: SSH-Verbindung gescheitert)."; exit 1 ;;
          esac

      - name: Identität von aussen prüfen
        env:
          # Siehe oben: `vars` ist der Zielzustand, das Secret der Übergang.
          API_URL: ${{ vars.API_URL || secrets.API_URL }}
          ERWARTET: ${{ github.sha }}
          BUILD_ID: ${{ steps.beilage.outputs.buildid }}
        run: |
          set -euo pipefail
          if [ -z "${API_URL:-}" ]; then
            echo "::warning::API_URL fehlt — die Prüfung von aussen entfällt (auf dem Server ist die Identität bestätigt)."
            exit 0
          fi

          # Zwei Fragen, nicht eine. Erstens: antwortet die öffentliche Adresse
          # überhaupt? Das prüft die ganze Kette samt Reverse Proxy und TLS,
          # die die Prüfung auf dem Server selbst nie berührt. Zweitens:
          # antwortet **genau dieser Bau**? Verglichen wird dieselbe Identität
          # wie auf dem Server — Commit, Build-ID der Beilage, `belegt`. Der
          # Commit allein genügte nicht: Ein zweiter Bau desselben Commits hat
          # eine andere Build-ID und ist nie geprüft worden.
          for i in $(seq 1 10); do
            antwort="$(curl -fsS --max-time 15 "${API_URL%/}/api/health" || true)"
            if [ -n "$antwort" ]; then
              echo "$antwort" | jq .
              status="$(echo "$antwort" | jq -r '.data.status // empty')"
              version="$(echo "$antwort" | jq -r '.data.version // empty')"
              build="$(echo "$antwort" | jq -r '.data.buildId // empty')"
              identitaet="$(echo "$antwort" | jq -r '.data.identitaet // empty')"
              if [ "$status" = "ok" ] && [ "$version" = "$ERWARTET" ] && [ "$build" = "$BUILD_ID" ] && [ "$identitaet" = "belegt" ]; then
                echo "Ausgelieferter Stand von aussen bestätigt: $version, Build $build."
                exit 0
              fi
              echo "Versuch $i: status=$status version=$version buildId=$build identitaet=$identitaet (erwartet $ERWARTET / $BUILD_ID / belegt)"
            else
              echo "Versuch $i: keine Antwort."
            fi
            sleep 6
          done
          echo "::error::Von aussen meldet sich nicht die erwartete Identität."
          exit 1

      - name: Zusammenfassung
        if: always()
        # Die Werte kommen über `env` und nicht als Ausdruck in den Text des
        # Skripts (2026-09-26). Ein Ausdruck im `run:`-Block wird **vor** der
        # Shell eingesetzt: Enthielte er ein `"` oder `$(…)`, wäre er Code.
        # `github.actor` ist heute auf Buchstaben, Ziffern und Bindestrich
        # beschränkt und `vars.API_URL` setzt nur, wer das Repository
        # verwaltet — sicher also schon vorher. Die Regel soll aber nicht davon
        # abhängen, dass jemand bei jedem neuen Feld nachprüft, wer es füllt.
        env:
          STATUS: ${{ job.status }}
          STAND: ${{ github.sha }}
          AUSLOESER: ${{ github.event_name }}
          VON: ${{ github.actor }}
          ZIEL: ${{ vars.API_URL }}
          SUMME: ${{ steps.beilage.outputs.sha256 }}
          AKTIVIERUNG: ${{ steps.aktivieren.outputs.code }}
        run: |
          {
            echo "## Auslieferung ${STATUS}"
            echo ""
            echo "| Feld | Wert |"
            echo "|---|---|"
            echo "| Stand | \`${STAND}\` |"
            echo "| SHA-256 | \`${SUMME}\` |"
            echo "| Aktivierung (Ausgang) | ${AKTIVIERUNG} |"
            echo "| Auslöser | ${AUSLOESER} |"
            echo "| Von | ${VON} |"
            # Hier bewusst **nur** `vars`, ohne Rückfall auf das Secret.
            #
            # Die Zusammenfassung ist eine Anzeigefläche, kein Arbeitsschritt:
            # Sie wird gebraucht, um nachzulesen, wohin geliefert wurde. Ein
            # Wert aus dem `secrets`-Kontext hat in einer solchen Fläche
            # nichts zu suchen — auch dann nicht, wenn er wie hier ohnehin
            # öffentlich ist. Die Regel «Secrets stehen in keiner Ausgabe»
            # verliert ihren Wert, sobald sie Ausnahmen kennt, über die man
            # von Fall zu Fall entscheidet.
            #
            # Ist die Variable nicht gesetzt, bleibt die Zelle leer. Das ist
            # richtig so: Sie sagt dann «nicht als Variable hinterlegt» und
            # behauptet nichts.
            echo "| Ziel | ${ZIEL} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # =========================================================================
  #  3) Reproduzierbarkeit — nur von Hand
  # =========================================================================
  #
  # Derselbe Commit, zweimal gebaut, derselbe Baum? Erst dann heisst „das
  # Artefakt entspricht dem Commit" mehr als „es wurde aus ihm gebaut": Wer
  # das Artefakt anzweifelt, kann den Bau wiederholen und vergleichen. Der
  # Vergleich (`scripts/bau-vergleich.ts`) kennt die Unterschiede, die ein
  # Bau zwangsläufig hat, und scheitert an jedem anderen; der Bericht wird
  # abgelegt.
  #
  # Nur bei `workflow_dispatch`: Zwei vollständige Bauten verdoppeln die
  # Laufzeit, und die Frage ändert sich nicht mit jedem Push. Kein Secret,
  # keine Auslieferung, nur Lesen am Repository.
  reproduzierbarkeit:
    name: Reproduzierbarkeit
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    # Dieselbe Wegwerf-Datenbank wie im Qualitätstor: Der Bau rendert die
    # Website aus ihr vor, also braucht er Schema und Konfiguration.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clenaris
          POSTGRES_PASSWORD: clenaris
          POSTGRES_DB: clenaris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clenaris -d clenaris_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://clenaris:clenaris@localhost:5432/clenaris_test
      DIRECT_URL: postgresql://clenaris:clenaris@localhost:5432/clenaris_test
      JWT_SECRET: ci-nur-fuer-den-testlauf-mindestens-32-zeichen
      CRON_SECRET: ci-cron-secret
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: https://clenaris.qasemi.ch
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Node einrichten
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Datenbankschema anwenden
        run: npx prisma migrate deploy

      - name: Konfiguration einspielen
        # Wie im Qualitätstor: nur Konfiguration, damit beide Bauten denselben
        # Bestand sehen, den auch der ausgelieferte Bau sah.
        run: npm run db:seed

      - name: Bau A
        env:
          NODE_ENV: production
        run: npm run build

      - name: Bau A beiseitelegen
        run: mv .next bau-a

      - name: Bau B (sauber)
        # Ohne `.next` und ohne dessen Zwischenspeicher — sonst verglichen
        # sich der zweite Bau mit Teilen des ersten.
        env:
          NODE_ENV: production
        run: |
          rm -rf .next
          npm run build

      - name: Bauten vergleichen
        run: npx tsx scripts/bau-vergleich.ts bau-a .next --bericht bau-vergleich.json

      - name: Vergleichsbericht sichern
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bau-vergleich
          path: bau-vergleich.json
          if-no-files-found: warn
          retention-days: 30
