# Protokollrotation der Clenaris-Überwachung.
#
# VORLAGE. Nach /etc/logrotate.d/clenaris-monitor kopieren (root:root 0644).
# Nicht eingerichtet, nicht ausgeliefert.
#
# Die Protokolle enthalten Zeitpunkte, Status und Zusammenfassungen — keine
# Tokens, keine Webhook-Adressen (die Skripte schreiben sie nicht). Vierzehn
# Tage genügen, um einen Vorfall nachzuvollziehen; länger gehören sie in ein
# zentrales Protokollsystem, nicht auf die Platte des Überwachungsrechners.

/var/log/clenaris-monitor/*.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    create 0640 clenaris-monitor adm
    su clenaris-monitor adm
}
